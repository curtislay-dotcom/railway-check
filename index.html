<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電車線巡檢回報系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h1 class="text-xl font-bold text-center text-blue-600 mb-6">電車線巡檢回報系統</h1>
        
        <!-- 分駐所選擇 -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">分駐所 / 身份選擇</label>
            <select id="substationSelect" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">請選擇分駐所或值班管理</option>
                <option value="值班管理">⭐ 值班管理 (全轄區開放與多次彙整)</option>
                <option value="雙溪所">雙溪所</option>
                <option value="礁溪所">礁溪所</option>
                <option value="蘇新所">蘇新所</option>
                <option value="和平所">和平所</option>
            </select>
        </div>

        <!-- 站點區間多選 -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">起迄站點（可複選，自動串接）</label>
            <div id="stationsContainer" class="border border-gray-300 rounded-lg p-3 max-h-48 overflow-y-auto bg-gray-50 text-sm">
                <span class="text-gray-400">請先選擇分駐所或值班管理</span>
            </div>
        </div>

        <!-- 路線多選 -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">路線（可複選）</label>
            <div class="flex gap-4 p-2 border border-gray-300 rounded-lg bg-gray-50">
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" name="route" value="東線" class="route-checkbox h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700">東線</span>
                </label>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" name="route" value="西線" class="route-checkbox h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700">西線</span>
                </label>
            </div>
        </div>

        <!-- 值班管理專用：列入按鈕 -->
        <div id="dutyActionContainer" class="mb-4 hidden">
            <button id="includeBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg shadow transition duration-200 text-center text-sm flex items-center justify-center gap-1">
                <span>➕</span> 列入回報清單
            </button>
        </div>

        <!-- 預覽區 -->
        <div class="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-semibold text-blue-800">訊息預覽：</h2>
                <span id="editHint" class="text-xs text-amber-600 hidden">✏️ 值班管理模式：內容可自由編輯與多次列入</span>
            </div>
            <textarea id="previewText" rows="5" class="w-full p-3 rounded border border-blue-200 text-sm text-gray-700 font-mono bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none resize-y" readonly placeholder="請完整填寫上方欄位..."></textarea>
        </div>

        <!-- 按鈕 -->
        <div class="flex gap-3">
            <button id="sendBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-4 rounded-lg shadow transition duration-200 text-center">
                傳送到 LINE 群組
            </button>
            <button id="copyBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2.5 px-4 rounded-lg transition duration-200 text-center">
                複製文字
            </button>
        </div>
    </div>

    <script>
        // 各分駐所站點對應資料
        const stationData = {
            "雙溪所": ["八堵0K", "四腳亭", "瑞芳", "猴硐", "三貂嶺", "雙溪", "貢寮", "福隆", "草嶺南"],
            "礁溪所": ["草嶺南", "大里", "龜山", "頭城", "礁溪", "四城", "宜蘭", "二結", "羅東S/P"],
            "蘇新所": ["羅東S/P", "羅東", "冬山", "蘇澳新", "永樂", "東澳", "南澳", "武塔S/P", "蘇澳~蘇澳新"],
            "和平所": ["武塔S/P", "漢本", "和平", "和仁", "崇德", "崇德S/P"]
        };

        const allStations = Object.values(stationData).flat();

        const substationSelect = document.getElementById('substationSelect');
        const stationsContainer = document.getElementById('stationsContainer');
        const previewTextDiv = document.getElementById('previewText');
        const editHint = document.getElementById('editHint');
        const dutyActionContainer = document.getElementById('dutyActionContainer');
        const includeBtn = document.getElementById('includeBtn');
        const sendBtn = document.getElementById('sendBtn');
        const copyBtn = document.getElementById('copyBtn');
        const routeCheckboxes = document.querySelectorAll('.route-checkbox');

        let liffId = "2012197408-pR7dX7VG"; 

        async function initializeLiff() {
            try {
                await liff.init({ liffId: liffId });
                if (liff.isInClient() && !liff.isLoggedIn()) {
                    liff.login();
                }
            } catch (error) {
                console.error('LIFF 初始化失敗：', error);
            }
        }
        initializeLiff();

        // 當分駐所切換時
        substationSelect.addEventListener('change', function() {
            const selectedVal = this.value;
            stationsContainer.innerHTML = '';

            if (!selectedVal) {
                stationsContainer.innerHTML = '<span class="text-gray-400">請先選擇分駐所或值班管理</span>';
                setDutyMode(false);
                previewTextDiv.value = "";
                return;
            }

            let targetStations = [];
            
            if (selectedVal === "值班管理") {
                targetStations = allStations;
                setDutyMode(true);
                previewTextDiv.value = "(宜力段巡查匯整第  報)\n";
            } else {
                targetStations = stationData[selectedVal] || [];
                setDutyMode(false);
                updatePreview();
            }

            // 渲染站點核取方框
            targetStations.forEach(station => {
                const label = document.createElement('label');
                label.className = 'flex items-center space-x-2 py-1 cursor-pointer hover:bg-gray-100 px-1 rounded';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.name = 'station';
                checkbox.value = station;
                checkbox.className = 'station-checkbox h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500';
                
                checkbox.addEventListener('change', function() {
                    if (substationSelect.value !== "值班管理") {
                        updatePreview();
                    }
                });

                const span = document.createElement('span');
                span.textContent = station;

                label.appendChild(checkbox);
                label.appendChild(span);
                stationsContainer.appendChild(label);
            });
        });

        // 切換值班管理模式與一般模式的介面狀態
        function setDutyMode(isDuty) {
            if (isDuty) {
                dutyActionContainer.classList.remove('hidden');
                previewTextDiv.readOnly = false;
                previewTextDiv.classList.remove('bg-white');
                previewTextDiv.classList.add('bg-amber-50', 'border-amber-300');
                editHint.classList.remove('hidden');
            } else {
                dutyActionContainer.classList.add('hidden');
                previewTextDiv.readOnly = true;
                previewTextDiv.classList.add('bg-white');
                previewTextDiv.classList.remove('bg-amber-50', 'border-amber-300');
                editHint.classList.add('hidden');
            }
        }

        // 路線變動監聽
        routeCheckboxes.forEach(cb => cb.addEventListener('change', function() {
            if (substationSelect.value !== "值班管理") {
                updatePreview();
            }
        }));

        // 取得當前勾選組合的字串（結尾自動附加「電車線設備OK」）
        function getCurrentSelectionString() {
            const checkedStations = Array.from(document.querySelectorAll('.station-checkbox:checked')).map(cb => cb.value);
            const checkedRoutes = Array.from(document.querySelectorAll('.route-checkbox:checked')).map(cb => cb.value);

            if (checkedStations.length === 0 || checkedRoutes.length === 0) {
                return null;
            }

            const stationString = checkedStations.join('~');
            const routeString = checkedRoutes.join('、');

            return `${stationString} ${routeString} 電車線設備OK`;
        }

        // 一般模式的即時預覽更新
        function updatePreview() {
            const substation = substationSelect.value;
            if (!substation || substation === "值班管理") return;

            const selectionStr = getCurrentSelectionString();
            if (!selectionStr) {
                previewTextDiv.value = "請完整選擇起迄站點與路線...";
                return;
            }
            previewTextDiv.value = selectionStr;
        }

        // 點擊「列入」按鈕（值班管理專用）
        includeBtn.addEventListener('click', function() {
            const selectionStr = getCurrentSelectionString();
            if (!selectionStr) {
                alert("請先勾選至少一個起迄站點與路線，才能列入！");
                return;
            }

            let currentText = previewTextDiv.value.trimEnd();
            previewTextDiv.value = currentText + "\n" + selectionStr;

            document.querySelectorAll('.station-checkbox:checked').forEach(cb => cb.checked = false);
            routeCheckboxes.forEach(cb => cb.checked = false);
        });

        // 發送到 LINE 群組
        sendBtn.addEventListener('click', async function() {
            const text = previewTextDiv.value.trim();
            if (!text || text.startsWith("請完整")) {
                alert("目前沒有可發送的內容！");
                return;
            }

            if (liff.isInClient()) {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                if (liff.isApiAvailable('shareTargetPicker')) {
                    try {
                        const res = await liff.shareTargetPicker([
                            {
                                type: 'text',
                                text: text
                            }
                        ]);
                        if (res) {
                            alert("訊息已成功發送至指定的群組！");
                        }
                    } catch (error) {
                        alert("分享取消或發生錯誤：" + error.message);
                    }
                } else {
                    alert("目前不支援 shareTargetPicker 權限，請確認後台設定。");
                }
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert("已複製回報文字到剪貼簿！可貼上至 LINE 聊天室。");
                }).catch(err => {
                    alert("複製失敗：" + err);
                });
            }
        });

        // 複製按鈕
        copyBtn.append('click', function() {}); // placeholder safety
        copyBtn.addEventListener('click', function() {
            const text = previewTextDiv.value.trim();
            if (!text || text.startsWith("請完整")) {
                alert("目前沒有內容可供複製！");
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                alert("已成功複製回報文字！");
            }).catch(err => {
                alert("複製失敗：" + err);
            });
        });
    </script>
</body>
</html>
